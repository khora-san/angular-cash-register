<button
        class="card product-card"
        [class.sold-out]="availableStock() <= 0"
        [disabled]="availableStock() <= 0"
        (click)="onSelect()"
        [class.selected]="inNote()"
>
    <span class="icon">{{ icon() }}</span>
    <span class="name">{{ product().name }}</span>
    <span class="price">{{ product().price | euros }}</span>
    @if (availableStock() > 0) {
        <span class="badge" [class.badge-warning]="availableStock() <= 3">{{ availableStock() }} en stock</span>
    } @else {
        <span class="badge badge-danger">Hors stock</span>
    }
</button>
